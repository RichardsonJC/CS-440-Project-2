[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent-ollama"
version = "0.1.0"
description = "Minimal standalone coding agent backed by Ollama"
requires-python = ">=3.10"
dependencies = [
    "pytest>=9.0.2",
]

[project.scripts]
mini-coding-agent = "mini_coding_agent:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
py-modules = ["mini_coding_agent", "agent_skills", "agent_hooks"]

[tool.ruff.lint]
# Pin the rule set so new ruff releases can't change what CI checks.
# E4/E7/E9/F are ruff's classic defaults; I keeps imports sorted.
select = ["E4", "E7", "E9", "F", "I"]
